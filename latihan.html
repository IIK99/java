<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mengenal Table HTML</title>
  </head>
  <body>
    <!-- membuat table dengan border -->
    <table border="1">
      <tr>
        <th colspan="3">Microsoft Office</th>
      </tr>
      <tr>
        <td rowspan="4">
          <img
            src="png-transparent-microsoft-office-365-word-logo-icon-3581216603.png"
            width="200"
            alt=""
          />
        </td>
      </tr>
      <tr>
        <td>Aplikasi</td>
        <td>Microsoft Word</td>
      </tr>
      <tr>
        <td>Warna logo</td>
        <td>Biru</td>
      </tr>
      <tr>
        <td>Fitur</td>
        <td>
          <ul>
            <li>Membuat Dokumen</li>
            <li>Menyunting Text</li>
            <li>Memformat Paragraf</li>
            <li>Menambah Gambar</li>
            <li>Menambah Tabel</li>
          </ul>
        </td>
      </tr>
    </table>
  </body>
</html>
